[package]
name = "agent-gateway"
version = "0.1.0"
edition = "2021"
description = "Passerelle de sécurité devant un LLM auto-hébergé : mTLS, politique sur les appels d'outils, audit JSON"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
axum = { version = "0.7", default-features = false, features = ["json", "tokio", "http1"] }
bytes = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
x509-parser = "0.16"

[dev-dependencies]
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
